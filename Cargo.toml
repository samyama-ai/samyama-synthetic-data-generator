[package]
name = "samyama-sdg"
version = "0.2.0"
edition = "2021"
description = "Samyama Synthetic Data Compiler: Declarative GraphQL @count + Regex/Ontology Data Dictionary & Causal Graph Generator"
license = "Apache-2.0"

[[bin]]
name = "sdg-rs"
path = "src/main.rs"

[lib]
name = "samyama_sdg"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
itoa = "1.0"
quick-xml = "0.37"
rayon = "1.11"
regex = "1.12"
ryu = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
